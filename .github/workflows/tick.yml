name: tick
on:
  schedule:
    - cron: "7 * * * *"    # menit ke-7 tiap jam (hindari menit 0 yang sering terlambat)
    - cron: "37 * * * *"   # kesempatan kedua per candle; aman karena bot idempotent
  workflow_dispatch: {}
concurrency:
  group: tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Panggil bot
        run: |
          curl -fsS -m 120 --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.TICK_URL }}"
