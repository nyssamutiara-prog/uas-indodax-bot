name: tick
on:
  schedule:
    - cron: "7 * * * *"   # menit ke-7 tiap jam (hindari menit 0 yang sering terlambat)
  workflow_dispatch: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil bot
        run: |
          curl -sS -m 120 --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.TICK_URL }}"
