<h1>Dashboard Bot Dry Run EMA Crossover</h1>
<div id="ringkas">Memuat...</div>
<table border="1" cellpadding="4" id="tbl"></table>
<script>
fetch('/api/data')
  .then(async r => {
    const t = await r.text();
    if (!r.ok) throw new Error('HTTP ' + r.status + ': ' + t.slice(0, 200));
    return JSON.parse(t);
  })
  .then(d => {
    const calls = d.calls || [];
    const diproses = calls.reduce((n, c) => n + (c.processed || []).length, 0);
    const error = calls.reduce((n, c) => n + (c.errors || []).length, 0);
    const akhir = calls[calls.length - 1] || {};
    document.getElementById('ringkas').innerHTML =
      'Total panggilan: ' + calls.length + '<br>' +
      'Candle diproses: ' + diproses + '<br>' +
      'Error: ' + error + '<br>' +
      'Equity terakhir: Rp' + Number(akhir.equity || 0).toLocaleString('id-ID');
    document.getElementById('tbl').innerHTML =
      '<tr><th>Waktu (UTC)</th><th>Diproses</th><th>Error</th><th>Equity</th></tr>' +
      calls.slice().reverse().map(c =>
        '<tr><td>' + c.t + '</td><td>' + (c.processed || []).length + '</td><td>' +
        (c.errors || []).map(e => e.msg).join('; ') + '</td><td>' + c.equity + '</td></tr>'
      ).join('');
  })
  .catch(e => { document.getElementById('ringkas').textContent = 'ERROR: ' + e.message; });
</script>
